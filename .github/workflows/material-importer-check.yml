name: Material importer checks
on:
  pull_request:
    paths: ['apps/material-importer/**', 'packages/course-project/**', '.github/workflows/material-importer-check.yml']
  push:
    branches: [main]
    paths: ['apps/material-importer/**', 'packages/course-project/**', '.github/workflows/material-importer-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/material-importer
      - run: pnpm test && pnpm run check && pnpm run build
        working-directory: apps/material-importer
