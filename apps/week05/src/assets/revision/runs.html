<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>第五周本机运行记录</title><style>body{font:16px/1.8 system-ui;margin:30px auto;max-width:1100px;padding:20px;color:#21334e;background:#f5f7fa}button{padding:10px 20px;margin:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ccd7e4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px}small{color:#65758a}</style><h1>第五周本机运行记录</h1><p>候选，未经教师确认。仅显示当前浏览器保存的实际请求、原文编号和输出；API Key不进入记录。页面状态与原件另由贯穿页完整备份。</p><button id="save">下载实际运行记录</button><button id="refresh">刷新列表</button><div id="records"></div><script type="module">
const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('pku-week05-research-v4',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});let runs=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){runs=await new Promise(resolve=>{const r=db.transaction('state').objectStore('state').get('runs');r.onsuccess=()=>resolve(r.result||[]);});document.querySelector('#records').innerHTML='<p>共'+runs.length+'条记录</p><table><tr><th>时间／页</th><th>模型／操作</th><th>来源／实际输出</th></tr>'+runs.map(r=>'<tr><td>'+esc(r.time||r.page)+'</td><td>'+esc(r.model||r.operation)+'</td><td><details><summary>'+esc((r.sourceIds||[]).join('、')||r.mode||'详细记录')+'</summary><pre>'+esc(JSON.stringify(r,null,2))+'</pre></details></td></tr>').join('')+'</table>';}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#save').onclick=()=>{const b=new Blob([JSON.stringify({schema:'week05-real-runs/v1',exported:new Date().toISOString(),runs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='第五周_实际运行记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};await refresh();
</script></html>
